<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파닉스 음원 만들기</title>
<style>
  body { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; background:#f6f4ef; color:#222; margin:0; padding:24px; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 6px; }
  p.help { font-size:14px; color:#666; margin:0 0 16px; line-height:1.5; }
  textarea { width:100%; box-sizing:border-box; font-size:28px; padding:12px; border:2px solid #ccc; border-radius:10px; font-family:ui-monospace, monospace; resize:vertical; min-height:90px; }
  textarea:focus { outline:none; border-color:#3b6fd8; }
  .row { display:flex; gap:10px; margin-top:12px; }
  button { flex:1; font-size:18px; padding:14px; border:0; border-radius:10px; cursor:pointer; background:#3b6fd8; color:#fff; }
  button.secondary { background:#555; }
  button:disabled { opacity:.5; cursor:default; }
  #info { margin-top:12px; font-size:14px; color:#555; min-height:20px; }
</style>
</head>
<body>
<main>
  <h1>파닉스 음원 만들기</h1>
  <p class="help">알파벳을 입력하면 글자마다 발음 소리로 읽습니다. 공백 하나당 1초 쉽니다. 숫자와 문장부호는 무시합니다.</p>
  <textarea id="txt" placeholder="예: bts  또는  a b c"></textarea>
  <div class="row">
    <button id="play" class="secondary">들어보기</button>
    <button id="save">MP3 다운로드</button>
  </div>
  <div id="info"></div>

const CLIPS = {};
for (const k in CLIPS_B64) {
  const bin = atob(CLIPS_B64[k]);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  CLIPS[k] = new Int16Array(bytes.buffer);
}

function build(text) {
  const parts = [];
  for (const ch of text.toLowerCase()) {
    if (CLIPS[ch]) parts.push(CLIPS[ch]);
    else if (ch === " ") parts.push(new Int16Array(SR));
  }
  const len = parts.reduce((n, p) => n + p.length, 0);
  const out = new Int16Array(len);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}

const txt = document.getElementById("txt");
const info = document.getElementById("info");
let ctx, src;

function current() {
  const pcm = build(txt.value);
  if (!pcm.length) { info.textContent = "읽을 알파벳이 없습니다."; return null; }
  info.textContent = "길이 " + (pcm.length / SR).toFixed(1) + "초";
  return pcm;
}

document.getElementById("play").onclick = () => {
  const pcm = current(); if (!pcm) return;
  ctx = ctx || new AudioContext();
  if (src) src.stop();
  const buf = ctx.createBuffer(1, pcm.length, SR);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
  src = ctx.createBufferSource();
  src.buffer = buf; src.connect(ctx.destination); src.start();
};

document.getElementById("save").onclick = () => {
  const pcm = current(); if (!pcm) return;
  const enc = new lamejs.Mp3Encoder(1, SR, 64);
  const chunks = [];
  for (let i = 0; i < pcm.length; i += 1152) {
    const b = enc.encodeBuffer(pcm.subarray(i, i + 1152));
    if (b.length) chunks.push(new Uint8Array(b));
  }
  const end = enc.flush(); if (end.length) chunks.push(new Uint8Array(end));
  const blob = new Blob(chunks, { type: "audio/mpeg" });
  const name = (txt.value.toLowerCase().replace(/[^a-z ]/g, "").trim().replace(/ +/g, "_") || "phonics").slice(0, 40);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name + ".mp3";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
