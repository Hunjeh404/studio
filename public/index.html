  if (!onStage && hero.userData.stage) { $('animalPanel').style.display = 'none'; stageView = false; }
  if (stageView) { yaw = stageYaw; hero.rotation.y = stageYaw; }
  hero.userData.stage = onStage;
  // 손님이 현관 앞에 서면 초인종
  $('bellBtn').style.display = acct === 'guest' && !frontOpen && x > 0.8 && x < 2.4 && z > 3.1 && z < 4.3 ? 'block' : 'none';
}

renderApps();
const signedIn = await initAuth();
refreshDoor();
let ret = null; try { ret = JSON.parse(sessionStorage.getItem('house:return') || 'null'); sessionStorage.removeItem('house:return'); } catch {}
if (ret && appAt[ret.id] && ACCOUNTS[ret.acct] && allowed.includes(ret.acct)) { acct = ret.acct; refreshDoor(); const s = appAt[ret.id]; spawnHero(s.at[0], s.at[1], Math.atan2(s.at[0] - s.pick[0], s.at[1] - s.pick[2])); }
else { const [x, z] = START[ACCOUNTS[acct].room]; spawnHero(x, z, 0); }
// 캐릭터 바꿀 때 빈 화면이 없도록 나머지 모델을 틈날 때 미리 불러둠
setTimeout(() => { let i = 0; const ks = [...GLB_KINDS]; const next = () => { if (i < ks.length) loadGlb(ks[i++]).catch(() => {}).finally(() => setTimeout(next, 150)); }; next(); }, 2500);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), 0.05); step(dt); applyAppVisibility(); updateCamera(dt); updateLabels(); renderFrame(); });
